<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Textile Material Playground — v0.1</title>
<style>
  body{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;background:#141210;color:#f2ece1;margin:0;padding:24px}
  h1{font-size:20px} p{color:#b9ae9c;font-size:13px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  button{background:#2a251d;color:#f2ece1;border:1px solid #5a4f3d;border-radius:8px;padding:8px 14px;cursor:pointer}
  button.on{background:#c79943;border-color:#c79943;color:#1a1409}
  canvas{border:1px solid #3a342a;border-radius:12px;width:100%;max-width:720px;background:#0c0a08}
  .meta{font-size:12px;color:#b9ae9c;max-width:720px}
</style>
</head>
<body>
<h1>Textile Material Playground <span style="color:#c79943">v0.1</span></h1>
<p>Canvas 2D 程序化经纬预览（离线单文件）。参数来自 presets/*.json —— 切换预设看密度 / 斜纹角 / 粗糙度如何改变观感。</p>
<div class="row" id="btns"></div>
<canvas id="c" width="720" height="360"></canvas>
<p class="meta" id="meta"></p>
<script>
// inline preset subset (mirrors ../presets/*.json core fields)
const PRESETS = {
  cotton:  {weave:{type:"plain",density:40,angle:0},  surface:{roughness:.70}, optics:{sheen:.10}},
  linen:   {weave:{type:"plain",density:34,angle:0},  surface:{roughness:.78}, optics:{sheen:.08}},
  silk:    {weave:{type:"satin",density:48,angle:0},  surface:{roughness:.28}, optics:{sheen:.74}},
  denim:   {weave:{type:"twill",density:44,angle:45}, surface:{roughness:.72}, optics:{sheen:.12}},
  organza: {weave:{type:"plain",density:30,angle:0},  surface:{roughness:.35}, optics:{sheen:.45}}
};
let cur = "denim";
const c = document.getElementById("c"), ctx = c.getContext("2d");
function draw(){
  const p = PRESETS[cur], W = c.width, H = c.height;
  const img = ctx.createImageData(W,H), d = img.data;
  const dens = p.weave.density, ang = p.weave.angle*Math.PI/180;
  const rough = p.surface.roughness, sheen = p.optics.sheen;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const u = x/W*8, v = y/H*4;
    const warp = 0.5+0.5*Math.sin(Math.PI*u*dens/8);
    const weft = 0.5+0.5*Math.sin(Math.PI*v*dens/8);
    let m;
    if(p.weave.type==="twill"){ const dg = ((u+v*Math.tan(ang))%2+2)%2; m = dg<1?warp:weft; }
    else if(p.weave.type==="satin"){ m = warp*0.8+weft*0.2; }
    else m = Math.max(warp,weft);
    const grain = (Math.sin(x*12.9898+y*78.233)*43758.5453%1)*rough*0.25;
    const light = 0.55+0.45*Math.cos((x/W-0.3)*2.2)*sheen + m*0.35;
    const i = (y*W+x)*4;
    const base = Math.max(0,Math.min(1,light*(0.75+m*0.4)+grain));
    d[i]=base*235; d[i+1]=base*220; d[i+2]=base*195; d[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  document.getElementById("meta").textContent =
    cur+" · "+p.weave.type+" · density "+p.weave.density+" · roughness "+p.surface.roughness+" · sheen "+p.optics.sheen;
  document.querySelectorAll("#btns button").forEach(b=>b.classList.toggle("on",b.textContent===cur));
}
const box = document.getElementById("btns");
Object.keys(PRESETS).forEach(k=>{ const b=document.createElement("button"); b.textContent=k;
  b.onclick=()=>{cur=k;draw();}; box.appendChild(b); });
draw();
</script>
</body>
</html>
